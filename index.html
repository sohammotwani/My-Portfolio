<!DOCTYPE html>
<html lang="en">
<head>

    .content {
      background: white;

    .ad-container {
      width: 100%;
      min-height: 100px;
      margin: 25px 0;

    }

    .ad-label {
      font-size: 11px;
      color: #777;

      padding: 25px;

  <header>

  <main>

           data-full-width-responsive="true"></ins>

      (adsbygoogle = window.adsbygoogle || []).push({});

    <div class="content">

      </p>
