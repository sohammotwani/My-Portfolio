<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Website</title>

  <meta
    name="description"
    content="My website with advertisements"
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
      line-height: 1.6;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }

    main {
      max-width: 900px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    h1 {
      margin-bottom: 15px;
    }

    p {
      margin-bottom: 20px;
    }

    footer {
      text-align: center;
      padding: 25px;
      margin-top: 40px;
      background: #111;
      color: white;
    }
  </style>
</head>

<body>

  <header>
    <h1>My Website</h1>
  </header>

  <main>
    <div class="card">
      <h1>Welcome 👋</h1>

      <p>
        Welcome to my website. This is a test page
        with an advertising script.
      </p>

      <p>
        You can replace this content with your own website content.
      </p>
    </div>
  </main>

  <footer>
    © 2026 My Website
  </footer>


  <!-- Advertisement Script -->
  <script>
    (function(s) {
      s.dataset.zone = '11534096';
      s.src = 'https://al5sm.com/tag.min.js';
    })(
      [document.documentElement, document.body]
        .filter(Boolean)
        .pop()
        .appendChild(document.createElement('script'))
    );
  </script>

</body>
</html>
